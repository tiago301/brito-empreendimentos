<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brito Empreendimentos</title>
<style>
:root {
  --bg:#f4f6fb;--sidebar-bg:#0f172a;--sidebar-w:248px;
  --accent:#3b82f6;--accent-dark:#1d4ed8;--green:#10b981;--red:#ef4444;--yellow:#f59e0b;--purple:#8b5cf6;
  --white:#fff;--border:#e2e8f0;--text:#0f172a;--text-muted:#94a3b8;--text-soft:#64748b;
  --radius:14px;--radius-sm:8px;--shadow:0 1px 4px rgba(0,0,0,.07),0 4px 16px rgba(0,0,0,.05);--shadow-md:0 4px 24px rgba(0,0,0,.12);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100vh;overflow:hidden;font-size:14px}

/* HEADER */
#header{height:56px;background:var(--sidebar-bg);display:flex;align-items:center;padding:0 20px;gap:12px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.06);z-index:200}
.logo-icon{width:30px;height:30px;background:linear-gradient(135deg,#3b82f6,#8b5cf6);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-text{color:#fff;font-weight:700;font-size:15px}.logo-text span{color:#60a5fa}
#hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.hdr-badge{background:rgba(255,255,255,.08);color:rgba(255,255,255,.55);padding:3px 10px;border-radius:20px;font-size:12px}
.hdr-user{width:30px;height:30px;background:linear-gradient(135deg,#10b981,#3b82f6);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}

/* LAYOUT */
#layout{display:flex;flex:1;overflow:hidden}

/* SIDEBAR */
#sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);overflow-y:auto;flex-shrink:0;padding:12px 0 24px;border-right:1px solid rgba(255,255,255,.05)}
#sidebar::-webkit-scrollbar{width:3px}
#sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:2px}
.sb-lbl{font-size:10px;font-weight:700;letter-spacing:1.2px;color:rgba(255,255,255,.25);text-transform:uppercase;padding:10px 16px 4px}
.sb-item{display:flex;align-items:center;gap:8px;padding:7px 12px;cursor:pointer;color:rgba(255,255,255,.55);font-size:13px;border-radius:8px;margin:1px 8px;transition:background .12s,color .12s;user-select:none}
.sb-item:hover{background:rgba(255,255,255,.07);color:rgba(255,255,255,.9)}
.sb-item.active{background:rgba(59,130,246,.2);color:#fff;font-weight:600}
.sb-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-pill{font-size:10px;background:rgba(255,255,255,.1);color:rgba(255,255,255,.5);padding:1px 5px;border-radius:10px;flex-shrink:0}
.sb-div{height:1px;background:rgba(255,255,255,.07);margin:8px 12px}
.dot-airbnb{background:#ff385c}.dot-imobiliaria{background:#3b82f6}.dot-moradia{background:#10b981}
.dot-venda{background:#f59e0b}.dot-lazer{background:#64748b}.dot-familia{background:#06b6d4}
.dot-terreno{background:#84cc16}.dot-comercial{background:#f97316}

/* MAIN */
#main{flex:1;overflow-y:auto;padding:24px 28px 48px}
#main::-webkit-scrollbar{width:5px}
#main::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}

/* PAGE HEADER */
.pg-hdr{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px;flex-wrap:wrap;gap:10px}
.pg-title{font-size:21px;font-weight:800;letter-spacing:-.4px}
.pg-sub{font-size:13px;color:var(--text-soft);margin-top:2px}

/* MONTH NAV */
.mn{display:inline-flex;align-items:center;gap:3px;background:#fff;border:1px solid var(--border);border-radius:10px;padding:4px 7px;box-shadow:var(--shadow)}
.mn button{width:27px;height:27px;border:none;background:none;cursor:pointer;border-radius:6px;font-size:15px;color:var(--text-soft);display:flex;align-items:center;justify-content:center;transition:background .1s}
.mn button:hover{background:#f1f5f9}
.mn-lbl{font-size:13px;font-weight:700;color:var(--text);padding:0 8px;min-width:136px;text-align:center}
.mn-hoje{padding:3px 9px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:700;cursor:pointer;margin-left:3px}
.mn-hoje:hover{background:var(--accent-dark)}

/* KPI GRID */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.kpi{background:#fff;border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--border);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.kpi.green::before{background:linear-gradient(90deg,#10b981,#34d399)}
.kpi.red::before{background:linear-gradient(90deg,#ef4444,#f87171)}
.kpi.blue::before{background:linear-gradient(90deg,#3b82f6,#60a5fa)}
.kpi.purple::before{background:linear-gradient(90deg,#8b5cf6,#a78bfa)}
.kpi.yellow::before{background:linear-gradient(90deg,#f59e0b,#fcd34d)}
.kpi-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text-soft);margin-bottom:7px}
.kpi-val{font-size:24px;font-weight:800;letter-spacing:-.4px}
.kpi-val.green{color:var(--green)}.kpi-val.red{color:var(--red)}.kpi-val.blue{color:var(--accent)}.kpi-val.purple{color:var(--purple)}.kpi-val.yellow{color:var(--yellow)}
.kpi-sub{font-size:11px;color:var(--text-muted);margin-top:3px}

/* CARD */
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:16px;overflow:hidden}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 11px;border-bottom:1px solid #f1f5f9}
.card-title{font-size:13px;font-weight:700}
.card-body{padding:14px 18px}

/* ALERTS */
.alert{display:flex;gap:10px;padding:12px 16px;border-radius:10px;margin-bottom:12px;font-size:13px}
.alert-icon{font-size:17px;flex-shrink:0;margin-top:1px}
.alert-title{font-weight:700;margin-bottom:2px}
.alert-warn{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}
.alert-danger{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
.alert-info{background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af}
.alert-success{background:#f0fdf4;border:1px solid #86efac;color:#166534}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-airbnb{background:#ffe4e8;color:#e11d48}.b-imobiliaria{background:#dbeafe;color:#1d4ed8}
.b-moradia{background:#d1fae5;color:#065f46}.b-venda{background:#fef3c7;color:#b45309}
.b-lazer{background:#f1f5f9;color:#475569}.b-familia{background:#cffafe;color:#0e7490}
.b-terreno{background:#ecfccb;color:#3f6212}.b-comercial{background:#ffedd5;color:#c2410c}
.b-ok{background:#d1fae5;color:#065f46}.b-pend{background:#fee2e2;color:#b91c1c}.b-parcial{background:#fef3c7;color:#b45309}
.b-pago{background:#d1fae5;color:#065f46}.b-aberto{background:#fee2e2;color:#b91c1c}.b-aguar{background:#fef3c7;color:#b45309}
.b-entrada{background:#dbeafe;color:#1d4ed8}

/* TABLE */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:9px 12px;background:#f8fafc;font-weight:700;color:var(--text-soft);border-bottom:2px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid #f1f5f9;color:var(--text)}
.tbl tr:last-child td{border-bottom:none}
.tbl tr.clickable:hover td{background:#f8fafc;cursor:pointer}
.num{text-align:right;font-variant-numeric:tabular-nums}
.tg{color:var(--green);font-weight:700}.tr{color:var(--red);font-weight:700}.tm{color:var(--text-muted)}

/* PIPELINE ROW */
.pipe-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f8fafc}
.pipe-row:last-of-type{border-bottom:none}
.pipe-cat{flex:1;font-size:13px;color:var(--text)}
.pipe-cat-sub{font-size:11px;color:var(--text-muted);margin-top:1px}
.pipe-val{width:120px;padding:6px 10px;border:1px solid var(--border);border-radius:7px;font-size:13px;text-align:right;background:#f8fafc;outline:none;transition:border-color .15s,background .15s}
.pipe-val:focus{border-color:var(--accent);background:#fff}
.pipe-venc{width:110px;padding:6px 9px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:#f8fafc;outline:none}
.pipe-venc:focus{border-color:var(--accent);background:#fff}
.pipe-actions{display:flex;gap:5px;flex-shrink:0}

/* STATUS BTNS */
.st-btn{width:28px;height:28px;border-radius:50%;border:2px solid #cbd5e1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all .15s;flex-shrink:0}
.st-btn.pago{background:var(--green);border-color:var(--green);color:#fff}
.st-btn.pendente{background:#fef3c7;border-color:var(--yellow);color:var(--yellow)}
.st-btn:hover{transform:scale(1.08)}

/* UPLOAD CHIP */
.up-chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px dashed #cbd5e1;color:var(--text-soft);background:#f8fafc;transition:all .15s}
.up-chip:hover{border-color:var(--accent);color:var(--accent);background:#eff6ff}
.up-chip.has-file{border-style:solid;border-color:var(--green);color:var(--green);background:#f0fdf4}

/* RESULT BAR */
.result-bar{display:flex;align-items:center;background:linear-gradient(135deg,#f0f9ff,#e0f2fe);border:1px solid #bae6fd;border-radius:10px;padding:14px 18px;gap:0;margin-top:14px}
.rb-item{flex:1;text-align:center}
.rb-lbl{font-size:10px;text-transform:uppercase;font-weight:700;letter-spacing:.7px;color:var(--text-soft);margin-bottom:3px}
.rb-val{font-size:17px;font-weight:800;letter-spacing:-.2px}
.rb-sep{width:1px;background:#bae6fd;height:36px;flex-shrink:0}

/* FORM */
.fg{margin-bottom:13px}
.fl{display:block;font-size:11px;font-weight:700;color:var(--text-soft);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.fi{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none;background:#f8fafc;transition:border-color .15s,background .15s}
.fi:focus{border-color:var(--accent);background:#fff}
textarea.fi{resize:vertical;min-height:70px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* TABS */
.tabs{display:flex;gap:3px;background:#f1f5f9;border-radius:10px;padding:3px;margin-bottom:18px;width:fit-content}
.tab{padding:6px 16px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text-soft);transition:all .15s;border:none;background:none}
.tab.active{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.tab:hover:not(.active){color:var(--text)}

/* CHECKLIST */
.cl{list-style:none}
.cl li{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid #f8fafc;font-size:13px}
.cl li:last-child{border-bottom:none}
.ck{width:19px;height:19px;border-radius:5px;border:2px solid #cbd5e1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:10px;transition:all .15s}
.ck.done{background:var(--green);border-color:var(--green);color:#fff}
.ck-lbl{flex:1}.ck-lbl.crossed{text-decoration:line-through;color:var(--text-muted)}

/* PROGRESS */
.prog-bg{background:#e2e8f0;height:5px;border-radius:3px;overflow:hidden;margin-top:5px}
.prog-fill{height:100%;border-radius:3px;transition:width .4s}
.prog-fill.green{background:var(--green)}.prog-fill.yellow{background:var(--yellow)}.prog-fill.red{background:var(--red)}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-dark)}
.btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#059669}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#dc2626}
.btn-outline{background:#fff;color:var(--text-soft);border:1px solid var(--border)}.btn-outline:hover{background:#f8fafc}
.btn-ghost{background:transparent;color:var(--text-soft);border:none;padding:5px 9px}.btn-ghost:hover{background:#f1f5f9}
.btn-sm{padding:4px 9px;font-size:12px}.btn-xs{padding:2px 7px;font-size:11px}

/* PROP HEADER */
.prop-hdr{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;padding:18px 20px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);border:1px solid var(--border)}
.prop-icon{width:44px;height:44px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.prop-icon.airbnb{background:#ffe4e8}.prop-icon.imobiliaria{background:#dbeafe}.prop-icon.moradia{background:#d1fae5}
.prop-icon.venda{background:#fef3c7}.prop-icon.lazer{background:#f1f5f9}.prop-icon.familia{background:#cffafe}
.prop-icon.terreno{background:#ecfccb}.prop-icon.comercial{background:#ffedd5}
.prop-name{font-size:19px;font-weight:800;letter-spacing:-.3px}
.prop-loc{font-size:12px;color:var(--text-soft);margin-top:2px}

/* HIST TABLE */
.htbl{width:100%;border-collapse:collapse;font-size:13px}
.htbl th{padding:8px 11px;background:#f8fafc;text-align:right;font-weight:700;color:var(--text-soft);font-size:11px;border-bottom:1px solid var(--border)}
.htbl th:first-child{text-align:left}
.htbl td{padding:8px 11px;border-bottom:1px solid #f8fafc;text-align:right;font-variant-numeric:tabular-nums}
.htbl td:first-child{text-align:left}

/* VENDA DRE */
.dre-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f8fafc;font-size:13px}
.dre-row.total{font-weight:700;font-size:15px;border-top:2px solid var(--border);border-bottom:none;padding-top:12px;margin-top:4px}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:flex;align-items:center;justify-content:center}
.modal{background:#fff;border-radius:var(--radius);padding:22px;width:440px;max-width:92vw;box-shadow:var(--shadow-md)}
.modal-title{font-size:15px;font-weight:800;margin-bottom:16px}

/* TOAST */
#toast-c{position:fixed;bottom:22px;right:22px;z-index:9999;display:flex;flex-direction:column;gap:7px}
.toast{background:#1e293b;color:#fff;padding:11px 16px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-md);animation:tin .22s ease;display:flex;align-items:center;gap:7px;min-width:210px}
.toast.success{border-left:3px solid var(--green)}.toast.error{border-left:3px solid var(--red)}.toast.info{border-left:3px solid var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes tout{from{opacity:1}to{opacity:0;transform:translateY(7px)}}
.toast.out{animation:tout .22s ease forwards}

/* CHART */
.chart-wrap{position:relative;height:250px}

/* UPLOAD AREA */
.up-area{border:2px dashed #cbd5e1;border-radius:var(--radius);padding:36px;text-align:center;cursor:pointer;transition:all .2s;background:#fff}
.up-area:hover,.up-area.over{border-color:var(--accent);background:#eff6ff}

/* STOR BAR */
.stor-bg{background:#e2e8f0;height:7px;border-radius:3px;overflow:hidden;margin-top:5px}
.stor-fill{height:100%;background:var(--accent);border-radius:3px}

/* CONCIL */
.concil-badge{background:#d1fae5;color:#065f46;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700}

/* EMPTY */
.empty{text-align:center;padding:44px 24px;color:var(--text-muted)}
.empty .ei{font-size:38px;margin-bottom:10px}
.empty .et{font-size:14px;font-weight:700;color:var(--text-soft)}

/* INLINE SELECT */
.isel{padding:4px 7px;border:1px solid var(--border);border-radius:6px;font-size:12px;background:#fff;cursor:pointer}

/* DOC CHECKLIST */
.doc-cat-hdr{display:flex;align-items:center;gap:8px;padding:10px 0 6px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text-soft);border-bottom:1px solid var(--border);margin-bottom:4px}
.doc-row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #f8fafc}
.doc-row:last-child{border-bottom:none}
.doc-ck{width:20px;height:20px;border-radius:5px;border:2px solid #cbd5e1;background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;margin-top:1px;transition:all .15s}
.doc-ck.done{background:var(--green);border-color:var(--green);color:#fff}
.doc-info{flex:1;min-width:0}
.doc-lbl{font-size:13px;font-weight:600;cursor:pointer;transition:color .1s}
.doc-lbl.crossed{text-decoration:line-through;color:var(--text-muted)}
.doc-meta{display:flex;align-items:center;gap:6px;margin-top:4px;flex-wrap:wrap}
.prio-critico{background:#fee2e2;color:#b91c1c;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700}
.prio-importante{background:#fef3c7;color:#b45309;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700}
.prio-normal{background:#f1f5f9;color:#475569;padding:1px 7px;border-radius:10px;font-size:10px;font-weight:700}
.doc-val-inp{width:130px;padding:3px 7px;border:1px solid var(--border);border-radius:6px;font-size:11px;background:#f8fafc}
.doc-obs-inp{width:200px;padding:3px 7px;border:1px solid var(--border);border-radius:6px;font-size:11px;background:#f8fafc}
.doc-actions{display:flex;align-items:center;gap:5px;flex-shrink:0}

/* CONTATOS */
.contact-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f8fafc}
.contact-row:last-child{border-bottom:none}
.contact-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;background:#f1f5f9}
.contact-info{flex:1}
.contact-role{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted)}
.contact-name{font-size:13px;font-weight:600;color:var(--text)}
.contact-detail{font-size:12px;color:var(--text-soft);margin-top:1px}

/* RESERVAS AIRBNB */
.reserva-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f8fafc}
.reserva-row:last-child{border-bottom:none}
.reserva-plat{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.plat-airbnb{background:#ffe4e8}.plat-booking{background:#dbeafe}.plat-direto{background:#d1fae5}

/* RELATÓRIO */
.rel-section{margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)}
.rel-section:last-child{border-bottom:none}
.rel-section-title{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--text-soft);margin-bottom:10px}
.rel-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:13px;border-bottom:1px solid #f8fafc}
.rel-row:last-child{border-bottom:none}
.rel-total{font-weight:700;font-size:14px;border-top:2px solid var(--border);padding-top:10px;margin-top:6px}

/* RANKING */
.rank-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f8fafc}
.rank-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;background:#f1f5f9;color:var(--text-soft)}
.rank-num.gold{background:#fef3c7;color:#b45309}
.rank-num.silver{background:#f1f5f9;color:#475569}
.rank-num.bronze{background:#ffedd5;color:#c2410c}

/* FUNIL VENDA */
.funil-stage{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;margin-bottom:6px;font-size:13px;cursor:pointer;transition:background .1s}
.funil-stage:hover{background:#f8fafc}
.funil-stage.active-stage{background:#eff6ff;border:1px solid #bfdbfe}

/* SEGURO */
.seguro-card{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:10px;padding:14px 16px;margin-bottom:10px}

/* ALERT VENCIMENTO */
.alert-venc-list{display:flex;flex-direction:column;gap:6px}
.alert-venc-item{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;font-size:12px}
.alert-venc-item.urgente{background:#fef2f2;border:1px solid #fca5a5;color:#991b1b}
.alert-venc-item.aviso{background:#fffbeb;border:1px solid #fcd34d;color:#92400e}
.alert-venc-item.ok{background:#f0fdf4;border:1px solid #86efac;color:#166534}

/* REAJUSTE */
.reaj-badge{background:#f0fdf4;border:1px solid #86efac;color:#065f46;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700}
.reaj-badge.vencendo{background:#fffbeb;border-color:#fcd34d;color:#92400e}
.reaj-badge.vencido{background:#fef2f2;border-color:#fca5a5;color:#991b1b}

@media(max-width:768px){
  #sidebar{width:52px}.sb-name,.sb-pill,.sb-lbl{display:none}
  #main{padding:14px}.kpi-grid{grid-template-columns:1fr 1fr}.fr{grid-template-columns:1fr}
}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

async function sbGet(table, extraFilters = '') {
  const url = `${SB_URL}/rest/v1/${table}?workspace_id=eq.${WS}${extraFilters}&select=*`;
  const r = await fetch(url, { headers: sbHeaders() });
  if (!r.ok) { console.error('sbGet', table, r.status); return []; }
  return r.json();
}

async function sbUpsert(table, row) {
  const r = await fetch(`${SB_URL}/rest/v1/${table}`, {
    method: 'POST',
    headers: { ...sbHeaders(), 'Prefer': 'resolution=merge-duplicates,return=minimal' },
    body: JSON.stringify({ workspace_id: WS, ...row })
  });
  if (!r.ok) console.error('sbUpsert', table, r.status, await r.text());
}

// Cache em memória para evitar latência nas leituras repetidas dentro da mesma sessão
const _cache = {};
function _ck(t, k) { return `${t}::${k}`; }

// Tabelas com PK (workspace_id, prop_id): be_docs, be_ficha, be_contatos, be_seguros, be_reajuste, be_funil, be_responsavel, be_props
// Tabelas com PK (workspace_id, prop_id, ym): be_pipeline, be_reservas
// Tabelas com PK (workspace_id, id): be_agenda
// Tabelas com PK (workspace_id, ym): be_extrato
// Para simplificar, usamos uma coluna virtual "data_key" = prop_id ou ym concatenado
// A estratégia: todas as tabelas usam (workspace_id, prop_id) ou variações — guardamos o blob inteiro em "data"
// Usamos prop_id='_main_' para dados sem prop (agenda, extrato, props)

async function dbGet(table, key) {
  const ck = _ck(table, key);
  if (_cache[ck] !== undefined) return _cache[ck];
  const rows = await sbGet(table, `&prop_id=eq.${encodeURIComponent(key)}`);
  const val = rows.length ? (rows[0].data ?? null) : null;
  _cache[ck] = val;
  return val;
}

async function dbSet(table, key, val) {
  _cache[_ck(table, key)] = val;
  await sbUpsert(table, { prop_id: key, data: val });
}

// be_agenda e be_extrato têm PK diferente — usam prop_id='_main_' como chave única de blob
// be_pipeline e be_reservas têm PK (prop_id, ym) — mas guardamos blob inteiro em prop_id='_main_'

// SK agora mapeia para nomes de tabela Supabase
const SK = {
  pipeline:'be_pipeline', docs:'be_docs', agenda:'be_agenda',
  extrato:'be_extrato', ficha:'be_ficha',
  contatos:'be_contatos',
  reservas:'be_reservas',
  seguros:'be_seguros',
  reajuste:'be_reajuste',
  funil:'be_funil',
  responsavel:'be_responsavel',
  props:'be_props',
};

// ls agora é wrapper async (todas as funções que usam ls são async)
const ls = {
  get: (table) => dbGet(table, 'main'),
  set: (table, val) => dbSet(table, 'main', val)
};

// Imóveis dinâmicos: mescla base + cadastrados pelo usuário
async function loadUserProps() {
  const extra = await ls.get(SK.props) || [];
  for (const p of extra) {
    if (!PROPS.find(x => x.id === p.id)) PROPS.push(p);
  }
}

async function addProp(dados) {
  const extra = await ls.get(SK.props) || [];
  const idx = extra.findIndex(p => p.id === dados.id);
  if (idx >= 0) extra.splice(idx, 1);
  extra.push(dados);
  await ls.set(SK.props, extra);
  // Atualizar PROPS em memória
  const pi = PROPS.findIndex(p => p.id === dados.id);
  if (pi >= 0) PROPS.splice(pi, 1, dados); else PROPS.push(dados);
}

// Pipeline data: { [pid]: { [ym]: { custos: { [cid]: {valor,status,venc,comprovante,obs} }, entradas: { [eid]: {valor,status,data,comprovante,obs} } } } }
async function getPipeline(pid, ym) {
  const all = await ls.get(SK.pipeline) || {};
  if (!all[pid]) all[pid] = {};
  if (!all[pid][ym]) {
    const meta = PROPS.find(p => p.id === pid);
    all[pid][ym] = { custos: {}, entradas: {} };
    for (const c of (meta.custos || [])) {
      all[pid][ym].custos[c.id] = { valor: c.valor || 0, status: 'aberto', venc: '', comprovante: null, obs: '' };
    }
    for (const e of (meta.entradas || [])) {
      all[pid][ym].entradas[e.id] = { valor: e.valor || 0, status: 'aguardando', data: '', comprovante: null, obs: '' };
    }
    // Não salva automaticamente — apenas retorna o padrão sem sobrescrever dados no Supabase
  }
  return all[pid][ym];
}
async function savePipeline(pid, ym, data) {
  const all = await ls.get(SK.pipeline) || {};
  if (!all[pid]) all[pid] = {};
  all[pid][ym] = data;
  await ls.set(SK.pipeline, all);
}

async function getPropDocs(pid) {
  const all = await ls.get(SK.docs) || {};
  if (!all[pid]) {
    const m = PROPS.find(p => p.id === pid);
    // Migrar formato novo: docs[] com cat/prio
    all[pid] = (m.docs || []).map(d => ({
      id: d.id, cat: d.cat, label: d.label,

}
async function savePropDocs(pid, docs) { const all = await ls.get(SK.docs)||{}; all[pid]=docs; await ls.set(SK.docs,all); }

// Yield anual por imóvel: receita anual / valor mercado
async function computeYield(pid) {
  const allPipe=await ls.get(SK.pipeline)||{};
  const propPipe=allPipe[pid]||{};
  let totalEntradas=0;
  const meses=Object.keys(propPipe).sort().slice(-12);
  for(const ym of meses) for(const k in (propPipe[ym]?.entradas||{})) totalEntradas+=Number(propPipe[ym].entradas[k].valor)||0;
  const meta=PROPS.find(p=>p.id===pid);
  if(!meta||totalEntradas===0) return null;
  const ficha=await getFicha(pid);
  const vm=Number(ficha.valorImovel??meta.valorImovel)||0;
  if(!vm) return null;
  const anual=totalEntradas*(12/Math.max(1,meses.length));
  return (anual/vm*100).toFixed(1);
}

// Alertas de vencimento próximos (dias)
async function getVencimentos(diasAnte=7) {
  const hoje=new Date(); const alertas=[];
  for(const m of PROPS) {
    if(!m.custos) continue;
    for(const c of m.custos.filter(x=>x.tipo!=='info'&&x.vencDia)) {
      const dias=c.vencDia-hoje.getDate();
      if(dias>=0&&dias<=diasAnte) alertas.push({prop:m,custo:c,dias,urgente:dias<=2});
    }
  }
  // Documentos com validade vencendo
  for(const m of PROPS) {
    const docs=await getPropDocs(m.id);
    for(const d of docs) {
      if(!d.validade||d.done) continue;
      const diff=Math.ceil((new Date(d.validade)-hoje)/(1000*60*60*24));
      if(diff>=0&&diff<=30) alertas.push({prop:m,doc:d,dias:diff,urgente:diff<=7,isDoc:true});
    }
  }
  return alertas;
}

// ═══════════════════════════════════════
// COMPUTE
// ═══════════════════════════════════════
async function computeTotals(pid, ym) {
  const pipe = await getPipeline(pid, ym);
  let saidas = 0, entradas = 0;
  for (const k in pipe.custos) saidas += Number(pipe.custos[k].valor) || 0;
  for (const k in pipe.entradas) entradas += Number(pipe.entradas[k].valor) || 0;
  return { saidas, entradas, net: entradas - saidas };
}

async function computeAllTotals(ym) {
  let totalSaidas = 0, totalEntradas = 0, patrimonio = 0;
  for (const m of PROPS) {
    const t = await computeTotals(m.id, ym);
    totalSaidas += t.saidas; totalEntradas += t.entradas;
    // Preferir valor atualizado da ficha se disponível
    const ficha = await getFicha(m.id);
    patrimonio += Number(ficha.valorImovel ?? m.valorImovel) || 0;
  }
  return { totalSaidas, totalEntradas, net: totalEntradas - totalSaidas, patrimonio };
}

// Pipeline status counters
async function pipelineStatus(pid, ym) {
  const pipe = await getPipeline(pid, ym);
  let totalItems = 0, done = 0;
  for (const k in pipe.custos) { totalItems++; if (pipe.custos[k].status === 'pago') done++; }
  for (const k in pipe.entradas) { totalItems++; if (pipe.entradas[k].status === 'recebido') done++; }
  return { totalItems, done, pendente: totalItems - done };
}

const fmtSh = ym => { const [y,m]=ym.split('-'); return MONTHS_SH[+m-1]+'/'+y.slice(2); };

    const wrap = document.getElementById('dc-wrap');

    const n = Math.min(totals.length, props.length);
    const BAR_W = 18, GAP = 6, GROUP_GAP = 22;
    const PAD_L = 52, PAD_R = 12, PAD_T = 36, PAD_B = 56;
    const H_PLOT = 180;
    const totalW = PAD_L + n * (2 * BAR_W + GAP + GROUP_GAP) + PAD_R;
    const totalH = PAD_T + H_PLOT + PAD_B;

    const allVals = totals.flatMap(t => [t.entradas, t.saidas]);
    const maxVal = Math.max(...allVals, 1);

    function scaleY(v) { return H_PLOT - Math.round((v / maxVal) * H_PLOT); }
    function fmtK(v) {
      if (v >= 1000000) return 'R$' + (v/1000000).toFixed(1) + 'M';
      if (v >= 1000) return 'R$' + (v/1000).toFixed(0) + 'k';
      return 'R$' + v;

    let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalW}" height="${totalH}" style="font-family:-apple-system,sans-serif;font-size:10px">`;

    // Y grid lines (5 lines)
    for (let i = 0; i <= 4; i++) {
      const v = Math.round((maxVal / 4) * i);
      const y = PAD_T + scaleY(v);
      svg += `<line x1="${PAD_L}" y1="${y}" x2="${totalW - PAD_R}" y2="${y}" stroke="#e2e8f0" stroke-width="1"/>`;
      svg += `<text x="${PAD_L - 4}" y="${y + 4}" text-anchor="end" fill="#94a3b8">${fmtK(v)}</text>`;
    }

    // Bars
    for (let i = 0; i < n; i++) {
      const t = totals[i];
      const x0 = PAD_L + i * (2 * BAR_W + GAP + GROUP_GAP);

      // Entradas bar
      const heE = Math.max(Math.round((t.entradas / maxVal) * H_PLOT), 1);
      const xE = x0;
      const yE = PAD_T + H_PLOT - heE;
      svg += `<rect x="${xE}" y="${yE}" width="${BAR_W}" height="${heE}" fill="#86efac" rx="3"/>`;

      // Saídas bar
      const heS = Math.max(Math.round((t.saidas / maxVal) * H_PLOT), 1);
      const xS = x0 + BAR_W + GAP;
      const yS = PAD_T + H_PLOT - heS;
      svg += `<rect x="${xS}" y="${yS}" width="${BAR_W}" height="${heS}" fill="#fca5a5" rx="3"/>`;

      // Label
      const label = (props[i] && props[i].name) ? props[i].name.split(' ').slice(0, 2).join(' ') : `Imóvel ${i+1}`;
      const cx = x0 + BAR_W + GAP / 2;
      svg += `<text x="${cx}" y="${PAD_T + H_PLOT + 14}" text-anchor="middle" fill="#64748b" transform="rotate(35 ${cx} ${PAD_T + H_PLOT + 14})">${label}</text>`;
    }

    // Baseline
    svg += `<line x1="${PAD_L}" y1="${PAD_T + H_PLOT}" x2="${totalW - PAD_R}" y2="${PAD_T + H_PLOT}" stroke="#cbd5e1" stroke-width="1.5"/>`;

    // Legend
    svg += `<rect x="${PAD_L}" y="8" width="12" height="10" fill="#86efac" rx="2"/>`;
    svg += `<text x="${PAD_L + 16}" y="17" fill="#374151">Entradas</text>`;
    svg += `<rect x="${PAD_L + 72}" y="8" width="12" height="10" fill="#fca5a5" rx="2"/>`;
    svg += `<text x="${PAD_L + 88}" y="17" fill="#374151">Saídas</text>`;

    svg += `</svg>`;
    wrap.innerHTML = svg;
  })(allTotals, PROPS);
}

    const backPropMeta = PROPS.find(p => p.id === S.prevView);

  <span class="badge b-${meta.mode}">${MODE_LABEL[meta.mode]||meta.mode}</span>`;

    {id:'historico', label:'📊 Histórico'},

    btn.onclick=async ()=>{S.tab=t.id;await renderMain();}; tabs.appendChild(btn);

  main.appendChild(tabs);

}

// ─── FICHA CADASTRAL ───
async function renderPropFicha(main, meta) {
  const ficha = await getFicha(meta.id);
  const propMirror = ['nome','icon','mode','situacaoJuridica','valorImovel','custoAquisicao','iptu'];
  const modeToMeta = {nome:'name',icon:'icon',mode:'mode',situacaoJuridica:'situacaoJuridica',valorImovel:'valorImovel',custoAquisicao:'custoAquisicao',iptu:'iptu'};
  const isUserProp = !!((await ls.get(SK.props))||[]).find(p=>p.id===meta.id);
  const save = async (k, v) => {
    ficha[k] = v; await saveFicha(meta.id, ficha); toast('Salvo');
    // Sincronizar campos críticos no objeto meta e no be3_props se for imóvel do usuário
    if (propMirror.includes(k) && modeToMeta[k]) { meta[modeToMeta[k]] = v; }
    if (isUserProp) {
      const extra = await ls.get(SK.props)||[];
      const idx = extra.findIndex(p=>p.id===meta.id);
      if (idx>=0) { if(modeToMeta[k]) extra[idx][modeToMeta[k]]=v; await ls.set(SK.props, extra); }
    }
  };

  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = '<div class="card-hdr"><div class="card-title">🏠 Ficha Cadastral</div></div><div class="card-body"></div>';
  const body = card.querySelector('.card-body');

  // Seção: Identificação
  const mkSection = (title) => {
    const s = document.createElement('div'); s.style.cssText = 'margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--border)';
    s.innerHTML = `<div style="font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--text-soft);margin-bottom:10px">${title}</div>`;
    return s;
  };

  // metaMap: mapeamento de chave da ficha → chave correspondente no meta (para leitura de fallback)
  const metaMap = {nome:'name', icon:'icon', mode:'mode', situacaoJuridica:'situacaoJuridica', cidade:'city', estado:'state', valorImovel:'valorImovel', custoAquisicao:'custoAquisicao', iptu:'iptu'};
  const mkField = (label, key, type='text', placeholder='', opts=null) => {
    const fg = document.createElement('div'); fg.className = 'fg';
    fg.innerHTML = `<label class="fl">${label}</label>`;
    const metaKey = metaMap[key];
    const metaVal = metaKey ? (meta[metaKey] ?? '') : '';
    if (opts) {
      const sel = document.createElement('select'); sel.className = 'fi';
      const curVal = ficha[key] !== undefined ? ficha[key] : metaVal;
      for (const [v,l] of opts) { const o=document.createElement('option'); o.value=v; o.textContent=l; if(curVal===v) o.selected=true; sel.appendChild(o); }
      sel.onchange = () => save(key, sel.value);
      fg.appendChild(sel);
    } else {
      const inp = document.createElement('input'); inp.type = type; inp.className = 'fi';
      inp.value = ficha[key] !== undefined ? ficha[key] : metaVal;
      if (placeholder && !inp.value) inp.placeholder = placeholder;
      inp.onchange = () => save(key, type==='number' ? (parseFloat(inp.value.replace(',','.'))||0) : inp.value);
      fg.appendChild(inp);
    }
    return fg;
  };

  const formGrid = (fields) => {
    const fr = document.createElement('div'); fr.className = 'fr';
    for (const f of fields) fr.appendChild(mkField(...f));
    return fr;
  };

  // IDENTIFICAÇÃO
  const sId = mkSection('Identificação');
  sId.appendChild(formGrid([
    ['Nome do imóvel', 'nome', 'text', 'Ex: Ap Centro Floripa'],
    ['Ícone / emoji', 'icon', 'text', '🏠'],
  ]));
  sId.appendChild(formGrid([
    ['Tipo / Modo', 'mode', 'text', '', [['airbnb','Airbnb'],['imobiliaria','Imobiliária'],['moradia','Moradia'],['venda','À Venda'],['lazer','Lazer'],['familia','Família'],['terreno','Terreno'],['comercial','Comercial']]],
    ['Situação jurídica', 'situacaoJuridica', 'text', '', [['ok','✓ Documentação OK'],['parcial','⚠ Documentação parcial'],['pendente','✕ Documentação pendente']]],
  ]));
  body.appendChild(sId);

  // ENDEREÇO
  const sEnd = mkSection('Endereço');
  sEnd.appendChild(formGrid([
    ['Endereço completo', 'endereco', 'text', 'Rua, número, complemento'],
    ['Bairro', 'bairro', 'text', ''],
  ]));
  sEnd.appendChild(formGrid([
    ['Cidade', 'cidade', 'text', 'Ex: Curitiba'],
    ['Estado (UF)', 'estado', 'text', 'PR'],
    ['CEP', 'cep', 'text', '00000-000'],
  ]));
  body.appendChild(sEnd);

  // CARACTERÍSTICAS
  const sCarac = mkSection('Características');
  sCarac.appendChild(formGrid([
    ['Área privativa (m²)', 'area_privativa', 'number', ''],
    ['Área total (m²)', 'area_total', 'number', ''],
    ['Quartos', 'quartos', 'number', ''],
    ['Banheiros', 'banheiros', 'number', ''],
    ['Vagas de garagem', 'vagas', 'number', ''],
    ['Andar / Bloco', 'andar_bloco', 'text', 'Ex: 8º andar, Bloco B'],
  ]));
  body.appendChild(sCarac);

  // VALORES
  const sVal = mkSection('Valores');
  sVal.appendChild(formGrid([
    ['Valor de mercado atual (R$)', 'valorImovel', 'number', ''],
    ['Custo de aquisição (R$)', 'custoAquisicao', 'number', ''],
    ['IPTU anual (R$)', 'iptu', 'number', ''],
  ]));

  // Mostrar yield se tiver valor
  const vmk = ficha.valorImovel ?? meta.valorImovel;
  const yld = await computeYield(meta.id);
  if (vmk) {
    const info = document.createElement('div'); info.className = 'seguro-card';
    info.innerHTML = `<div style="font-size:12px;font-weight:700;color:#1e40af;margin-bottom:8px">Métricas Patrimoniais</div>
      <div class="rel-row"><span>Valor de mercado</span><strong>${fmt(ficha.valorImovel ?? meta.valorImovel)}</strong></div>
      <div class="rel-row"><span>Custo de aquisição</span><strong>${fmt(ficha.custoAquisicao ?? meta.custoAquisicao)}</strong></div>
      <div class="rel-row"><span>Valorização estimada</span><strong class="tg">+${fmt((ficha.valorImovel??meta.valorImovel)-(ficha.custoAquisicao??meta.custoAquisicao))}</strong></div>
      ${yld ? `<div class="rel-row"><span>Yield anual (12m)</span><strong class="tg">${yld}% a.a.</strong></div>` : ''}`;
    sVal.appendChild(info);
  }
  body.appendChild(sVal);

  // AQUISIÇÃO
  const sAq = mkSection('Histórico de Aquisição');
  sAq.appendChild(formGrid([
    ['Data de aquisição', 'data_aquisicao', 'date', ''],
    ['Forma de aquisição', 'forma_aquisicao', 'text', '', [['compra_direta','Compra direta'],['financiamento','Financiamento bancário'],['leilao','Leilão'],['heranca','Herança'],['doacao','Doação'],['permuta','Permuta'],['parcelado_proprietario','Parcelado c/ proprietário'],['parcelado_construtora','Parcelado c/ construtora'],['outro','Outro']]],
  ]));
  sAq.appendChild(formGrid([
    ['Nº da matrícula', 'matricula_num', 'text', 'Ex: 12345 — CRI Curitiba'],
    ['Cartório de Registro', 'cartorio', 'text', 'Ex: 1º CRI de Curitiba'],
  ]));
  const obsAq = document.createElement('div'); obsAq.className = 'fg';
  obsAq.innerHTML = '<label class="fl">Observações gerais</label>';
  const ta = document.createElement('textarea'); ta.className = 'fi'; ta.rows = 3;
  ta.style.resize = 'vertical';
  ta.value = ficha.obs_geral ?? meta.obs ?? '';
  ta.placeholder = 'Histórico, pendências, percepções sobre o imóvel...';
  ta.onchange = () => save('obs_geral', ta.value);
  obsAq.appendChild(ta); sAq.appendChild(obsAq);
  body.appendChild(sAq);

  main.appendChild(card);
}

// ─── PIPELINE POR IMÓVEL ───
async function renderPropPipeline(main, meta) {
  const ym=S.month, pipe=await getPipeline(meta.id, ym);
  let totalSaidas=0, totalEntradas=0;
  for (const k in pipe.custos) totalSaidas += Number(pipe.custos[k].valor)||0;
  for (const k in pipe.entradas) totalEntradas += Number(pipe.entradas[k].valor)||0;

  // ENTRADAS
  if (meta.entradas && meta.entradas.length) {
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<div class="card-hdr"><div class="card-title">📥 Entradas — Recebimentos</div></div><div class="card-body"></div>';
    const body=card.querySelector('.card-body');
    for (const e of meta.entradas) {
      const ed=pipe.entradas[e.id]||(pipe.entradas[e.id]={valor:e.valor||0,status:'aguardando',data:'',comprovante:null,obs:''});
      body.appendChild(await mkPipeRow({
        label: e.label, subLabel: e.recorrente?'Recorrente':'Variável',
        valor: ed.valor, status: ed.status,
        statusOpts: [{v:'aguardando',l:'Aguardando'},{v:'verificado',l:'Verificado'},{v:'recebido',l:'✓ Recebido'}],
        comprovante: ed.comprovante,
        onValor: async v => { ed.valor=v; await savePipeline(meta.id,ym,pipe); updateRB(); },
        onStatus: async s => { ed.status=s; await savePipeline(meta.id,ym,pipe); renderSidebar(); toast(s==='recebido'?'Marcado como recebido':s==='verificado'?'Verificado':'Aguardando'); },
        onComp: async f => { ed.comprovante=f; await savePipeline(meta.id,ym,pipe); toast('Comprovante salvo'); },
        onObs: async t => { ed.obs=t; await savePipeline(meta.id,ym,pipe); },
        isEntrada: true
      }));
    }
    main.appendChild(card);
  }

  // SAÍDAS
  const saidas = meta.custos ? meta.custos.filter(c=>c.tipo!=='info') : [];
  const infos = meta.custos ? meta.custos.filter(c=>c.tipo==='info') : [];

  if (saidas.length) {
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<div class="card-hdr"><div class="card-title">📤 Saídas — Pagamentos</div></div><div class="card-body"></div>';
    const body=card.querySelector('.card-body');
    for (const c of saidas) {
      const cd=pipe.custos[c.id]||(pipe.custos[c.id]={valor:c.valor||0,status:'aberto',venc:'',comprovante:null,obs:''});
      body.appendChild(await mkPipeRow({
        label: c.label, subLabel: c.recorrente?`Recorrente · vence dia ${c.vencDia||'?'}`:'Eventual',
        valor: cd.valor, status: cd.status,
        statusOpts: [{v:'aberto',l:'Em aberto'},{v:'boleto_ok',l:'Boleto OK'},{v:'pago',l:'✓ Pago'}],
        comprovante: cd.comprovante,
        onValor: async v => { cd.valor=v; await savePipeline(meta.id,ym,pipe); updateRB(); },
        onStatus: async s => { cd.status=s; await savePipeline(meta.id,ym,pipe); renderSidebar(); toast(s==='pago'?'Marcado como pago':s==='boleto_ok'?'Boleto OK registrado':'Em aberto'); },
        onComp: async f => { cd.comprovante=f; await savePipeline(meta.id,ym,pipe); toast('Comprovante salvo'); },
        onObs: async t => { cd.obs=t; await savePipeline(meta.id,ym,pipe); },
        isEntrada: false, pid: meta.id, cid: c.id
      }));
    }
    main.appendChild(card);
  }

  if (infos.length) {
    const infoCard=document.createElement('div'); infoCard.className='alert alert-info'; infoCard.style.marginBottom='16px';
    infoCard.innerHTML=`<div class="alert-icon">ℹ️</div><div><div class="alert-title">Descontos automáticos da imobiliária</div>${infos.map(i=>i.label).join(' · ')}<br><small>Esses valores são descontados antes do repasse — não há boleto separado.</small></div>`;
    main.appendChild(infoCard);
  }

  // Result bar
  const rb=document.createElement('div'); rb.className='result-bar'; rb.id='result-bar';
  function fillRB() {
    let si=0,ei=0;
    for(const k in pipe.custos) si+=Number(pipe.custos[k].valor)||0;
    for(const k in pipe.entradas) ei+=Number(pipe.entradas[k].valor)||0;
    rb.innerHTML=`<div class="rb-item"><div class="rb-lbl">Entradas</div><div class="rb-val tg">${fmt(ei)}</div></div><div class="rb-sep"></div><div class="rb-item"><div class="rb-lbl">Saídas</div><div class="rb-val tr">${fmt(si)}</div></div><div class="rb-sep"></div><div class="rb-item"><div class="rb-lbl">Resultado</div><div class="rb-val ${ei-si>=0?'tg':'tr'}">${fmt(ei-si)}</div></div>`;
  }
  fillRB(); main.appendChild(rb);
  window.updateRB = fillRB;
}

async function mkPipeRow({label, subLabel, valor, status, statusOpts, comprovante, onValor, onStatus, onComp, onObs, isEntrada, pid, cid}) {
  const row=document.createElement('div'); row.className='pipe-row';

  const info=document.createElement('div'); info.style.flex='1';
  info.innerHTML=`<div class="pipe-cat">${label}</div><div class="pipe-cat-sub">${subLabel}</div>`;

  // Responsável + forma (só saídas)
  if (!isEntrada && pid && cid) {
    const resp=await getResponsavel(pid,cid);
    const respSel=document.createElement('select'); respSel.className='isel'; respSel.title='Responsável';
    [{v:'assistente',l:'👩 Assistente'},{v:'imobiliaria',l:'🏢 Imobiliária'},{v:'auto',l:'🤖 Auto-débito'}].forEach(o=>{
      const op=document.createElement('option'); op.value=o.v; op.textContent=o.l; if(o.v===resp.resp) op.selected=true; respSel.appendChild(op);
    });
    respSel.onchange=async ()=>{resp.resp=respSel.value; await saveResponsavel(pid,cid,resp); toast('Responsável salvo');};
    const formaSel=document.createElement('select'); formaSel.className='isel'; formaSel.title='Forma';
    [{v:'boleto',l:'📄 Boleto'},{v:'pix',l:'💸 PIX'},{v:'debito',l:'🏦 Débito auto'},{v:'dinheiro',l:'💵 Dinheiro'}].forEach(o=>{
      const op=document.createElement('option'); op.value=o.v; op.textContent=o.l; if(o.v===resp.forma) op.selected=true; formaSel.appendChild(op);
    });
    formaSel.onchange=async ()=>{resp.forma=formaSel.value; await saveResponsavel(pid,cid,resp); toast('Forma salvo');};
    info.appendChild(respSel); info.appendChild(formaSel);
  }

  const valInp=document.createElement('input'); valInp.type='text'; valInp.className='pipe-val';
  valInp.value=valor>0?valor.toString():''; valInp.placeholder='R$ 0,00';
  valInp.onchange=()=>{const v=parseFloat(valInp.value.replace(',','.'))||0; onValor(v); toast('Valor salvo');};

  const sel=document.createElement('select'); sel.className='isel';
  for (const o of statusOpts) { const op=document.createElement('option'); op.value=o.v; op.textContent=o.l; if(o.v===status) op.selected=true; sel.appendChild(op); }
  sel.onchange=()=>onStatus(sel.value);

  const fi=document.createElement('input'); fi.type='file'; fi.accept='image/*,.pdf'; fi.style.display='none';
  const chip=document.createElement('div'); chip.className='up-chip'+(comprovante?' has-file':'');
  chip.innerHTML=comprovante?'📎 Ver':'📎 Comprovante';
  chip.onclick=()=>fi.click();
  fi.onchange=()=>{
    const f=fi.files[0]; if(!f) return;
    if(f.size>5*1024*1024){toast('Arquivo > 5MB','error');return;}
    const reader=new FileReader();
    reader.onload=e=>{onComp(e.target.result); chip.className='up-chip has-file'; chip.innerHTML='📎 Salvo ✓';};
    reader.readAsDataURL(f);
  };

  const actions=document.createElement('div'); actions.className='pipe-actions';
  actions.append(sel, chip, fi);

  row.append(info, valInp, actions);
  return row;
}

  const fields=[
    {key:'custo_aquisicao', label:'Custo de aquisição (R$)', val: ficha.custo_aquisicao ?? meta.custoAquisicao, type:'number'},

    {key:'itbi', label:'ITBI pago (R$)', val: ficha.itbi||'', type:'number'},
    {key:'comissao_imob', label:'Comissão imobiliária (R$)', val: ficha.comissao_imob||'', type:'number'},
    {key:'outros_custos_venda', label:'Outros custos de venda (R$)', val: ficha.outros_custos_venda||'', type:'number'},
    {key:'data_venda', label:'Data da venda', val: ficha.data_venda||'', type:'date'},
  ];

  for (const f of fields) {
    const fg=document.createElement('div'); fg.className='fg';
    fg.innerHTML=`<label class="fl">${f.label}</label>`;
    const inp=document.createElement('input'); inp.type=f.type||'text'; inp.className='fi';
    inp.value=f.val||''; if(f.placeholder) inp.placeholder=f.placeholder;
    inp.onchange=async ()=>{ficha[f.key]=f.type==='number'?(parseFloat(inp.value.replace(',','.'))||0):inp.value; await saveFicha(meta.id,ficha); renderDRE(main,meta);};
    fg.appendChild(inp); body.appendChild(fg);
  }

  // DRE calculation
  const venda=Number(ficha.valor_venda)||0;
  const aquisicao=Number(ficha.custo_aquisicao||meta.custoAquisicao)||0;
  const itbi=Number(ficha.itbi)||0;
  const comissao=Number(ficha.comissao_imob)||0;
  const outrosCustos=Number(ficha.outros_custos_venda)||0;
  const ganhoCapital=Math.max(0, venda - aquisicao);
  const irGanhoCapital = ganhoCapital > 0 ? ganhoCapital * 0.15 : 0; // 15% PF
  const lucroLiquido = venda - aquisicao - itbi - comissao - outrosCustos - custosTotais - irGanhoCapital;

  if (venda > 0) {
    const dre=document.createElement('div'); dre.style.marginTop='20px';
    dre.innerHTML=`<div style="font-size:13px;font-weight:700;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid var(--border)">Demonstrativo de Resultado</div>`;
    const rows=[
      {label:'(+) Valor de venda', val:venda, cls:'tg'},
      {label:'(-) Custo de aquisição', val:-aquisicao, cls:'tr'},
      {label:'(-) Custos acumulados (manutenção, IPTU, etc)', val:-custosTotais, cls:'tr'},
      {label:'(-) ITBI', val:-itbi, cls:'tr'},
      {label:'(-) Comissão imobiliária', val:-comissao, cls:'tr'},
      {label:'(-) Outros custos de venda', val:-outrosCustos, cls:'tr'},
      {label:'(-) IR sobre ganho de capital (15%)', val:-irGanhoCapital, cls:'tr'},
      {label:'= Lucro Líquido', val:lucroLiquido, cls:lucroLiquido>=0?'tg':'tr', total:true},
    ];
    for (const r of rows) {
      const d=document.createElement('div'); d.className='dre-row'+(r.total?' total':'');
      d.innerHTML=`<span>${r.label}</span><span class="${r.cls}">${fmt(Math.abs(r.val))} ${r.val<0&&!r.total?'':''}${r.val>=0&&!r.total?'(receita)':r.val<0&&!r.total?'(custo)':''}</span>`;
      dre.appendChild(d);
    }
    const pct=(lucroLiquido/aquisicao*100).toFixed(1);
    const pctEl=document.createElement('div'); pctEl.style.cssText='margin-top:12px;padding:12px 16px;background:#f0fdf4;border-radius:8px;font-size:13px;font-weight:600;color:#065f46';
    pctEl.textContent=`Retorno sobre investimento: ${pct}%`;
    dre.appendChild(pctEl);
    body.appendChild(dre);
  } else {
    const al=document.createElement('div'); al.className='alert alert-info'; al.style.marginTop='16px';
    al.innerHTML=`<div class="alert-icon">ℹ️</div><div>Preencha o valor de venda para ver o DRE completo. Custos acumulados já registrados: <strong>${fmt(custosTotais)}</strong></div>`;
    body.appendChild(al);
  }
  main.appendChild(card);
}

// ─── DOCUMENTOS POR IMÓVEL ───
async function renderPropDocs(main, meta) {
  main.innerHTML = '';
  const docs = await getPropDocs(meta.id);
  const done = docs.filter(d => d.done).length;
  const pct = docs.length ? Math.round(done / docs.length * 100) : 100;
  const pc = pct === 100 ? 'green' : pct > 50 ? 'yellow' : 'red';
  const criticos = docs.filter(d => d.prio === 'critico' && !d.done).length;

  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<div class="card-hdr">
    <div class="card-title">📄 Checklist de Documentos</div>
    <div style="display:flex;gap:6px;align-items:center">
      ${criticos > 0 ? `<span class="prio-critico">⚠ ${criticos} crítico${criticos>1?'s':''}</span>` : ''}
      <span class="badge ${pct===100?'b-ok':pct>50?'b-parcial':'b-pend'}">${done}/${docs.length}</span>
    </div>
  </div><div class="card-body">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-soft);margin-bottom:4px"><span>Progresso</span><span>${pct}%</span></div>
    <div class="prog-bg"><div class="prog-fill ${pc}" style="width:${pct}%"></div></div>
  </div>`;
  const body = card.querySelector('.card-body');

  async function redrawDocs() {
    body.querySelectorAll('.doc-section').forEach(e => e.remove());

    // Agrupar por categoria
    const cats = [...new Set(docs.map(d => d.cat || 'Geral'))];
    for (const cat of cats) {
      const catDocs = docs.filter(d => (d.cat || 'Geral') === cat);
      const sec = document.createElement('div'); sec.className = 'doc-section'; sec.style.marginTop = '14px';

      const catHdr = document.createElement('div'); catHdr.className = 'doc-cat-hdr';
      const catDone = catDocs.filter(d => d.done).length;
      catHdr.innerHTML = `<span>${cat}</span><span class="badge ${catDone===catDocs.length?'b-ok':catDone>0?'b-parcial':'b-pend'}" style="font-size:10px">${catDone}/${catDocs.length}</span>`;
      sec.appendChild(catHdr);

      for (let i = 0; i < docs.length; i++) {
        const d = docs[i];
        if ((d.cat || 'Geral') !== cat) continue;

        const row = document.createElement('div'); row.className = 'doc-row';

        // Checkbox
        const ck = document.createElement('div'); ck.className = 'doc-ck' + (d.done ? ' done' : ''); ck.innerHTML = d.done ? '✓' : '';
        ck.onclick = async () => { docs[i].done = !docs[i].done; await savePropDocs(meta.id, docs); redrawDocs(); renderSidebar(); };

        // Info
        const info = document.createElement('div'); info.className = 'doc-info';
        const lbl = document.createElement('div'); lbl.className = 'doc-lbl' + (d.done ? ' crossed' : ''); lbl.textContent = d.label;
        lbl.onclick = async () => { docs[i].done = !docs[i].done; await savePropDocs(meta.id, docs); redrawDocs(); renderSidebar(); };

        const meta2 = document.createElement('div'); meta2.className = 'doc-meta';
        meta2.innerHTML = `<span class="prio-${d.prio}">${d.prio === 'critico' ? '🔴 Crítico' : d.prio === 'importante' ? '🟡 Importante' : '⚪ Normal'}</span>`;
        if (d.arquivo) meta2.innerHTML += `<span class="up-chip has-file" style="cursor:pointer" onclick="viewDocFile(${i})">📎 Arquivo</span>`;
        if (d.validade) meta2.innerHTML += `<span style="font-size:11px;color:var(--text-muted)">Validade: ${d.validade}</span>`;
        if (d.obs) meta2.innerHTML += `<span style="font-size:11px;color:var(--text-soft);font-style:italic">${d.obs}</span>`;
        info.append(lbl, meta2);

        // Actions
        const actions = document.createElement('div'); actions.className = 'doc-actions';

        // Validade input
        const valInp = document.createElement('input'); valInp.type = 'date'; valInp.className = 'doc-val-inp'; valInp.title = 'Validade do documento';
        valInp.value = d.validade || '';
        valInp.onchange = async () => { docs[i].validade = valInp.value; await savePropDocs(meta.id, docs); redrawDocs(); };

        // Obs input
        const obsInp = document.createElement('input'); obsInp.type = 'text'; obsInp.className = 'doc-obs-inp'; obsInp.placeholder = 'Obs...';
        obsInp.value = d.obs || '';
        obsInp.onchange = async () => { docs[i].obs = obsInp.value; await savePropDocs(meta.id, docs); toast('Obs salvo'); };

        // Upload arquivo
        const fi = document.createElement('input'); fi.type = 'file'; fi.accept = 'image/*,.pdf'; fi.style.display = 'none';
        const upBtn = document.createElement('div'); upBtn.className = 'up-chip' + (d.arquivo ? ' has-file' : ''); upBtn.innerHTML = d.arquivo ? '📎 Salvo' : '📎';
        upBtn.title = 'Anexar documento';
        upBtn.onclick = () => fi.click();
        fi.onchange = async () => {
          const f = fi.files[0]; if (!f) return;
          if (f.size > 4 * 1024 * 1024) { toast('Arquivo maior que 4MB', 'error'); return; }
          const reader = new FileReader();
          reader.onload = async e => {
            docs[i].arquivo = { name: f.name, data: e.target.result };
            await savePropDocs(meta.id, docs); redrawDocs(); toast('Arquivo anexado');
          };
          reader.readAsDataURL(f);
        };

        // Ver arquivo
        if (d.arquivo) {
          const viewBtn = document.createElement('button'); viewBtn.className = 'btn btn-ghost btn-xs'; viewBtn.innerHTML = '👁';
          viewBtn.title = 'Ver arquivo';
          viewBtn.onclick = () => window.viewDocFile(i);
          actions.appendChild(viewBtn);
        }

        const delBtn = document.createElement('button'); delBtn.className = 'btn btn-ghost btn-xs'; delBtn.innerHTML = '×'; delBtn.title = 'Remover';
        delBtn.onclick = async () => { if (!confirm('Remover este documento?')) return; docs.splice(i, 1); await savePropDocs(meta.id, docs); renderPropDocs(main, meta); };

        actions.append(valInp, obsInp, upBtn, fi, delBtn);
        row.append(ck, info, actions);
        sec.appendChild(row);
      }
      body.appendChild(sec);
    }

    // Adicionar novo documento
    const addSection = document.createElement('div'); addSection.className = 'doc-section'; addSection.style.cssText = 'margin-top:16px;padding-top:12px;border-top:1px solid var(--border)';
    const addRow = document.createElement('div'); addRow.style.cssText = 'display:flex;gap:7px;flex-wrap:wrap;align-items:center';
    const ni = document.createElement('input'); ni.className = 'fi'; ni.placeholder = 'Nome do documento...'; ni.style.flex = '1;min-width:160px';
    const catSel = document.createElement('select'); catSel.className = 'isel';
    ['Base','Condomínio','Locação','Financiamento','Venda','Operação','Rural','Terreno','Outro'].forEach(c => { const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o); });
    const prioSel = document.createElement('select'); prioSel.className = 'isel';
    [{v:'critico',l:'🔴 Crítico'},{v:'importante',l:'🟡 Importante'},{v:'normal',l:'⚪ Normal'}].forEach(p => { const o = document.createElement('option'); o.value = p.v; o.textContent = p.l; prioSel.appendChild(o); });
    const ab = document.createElement('button'); ab.className = 'btn btn-primary btn-sm'; ab.innerHTML = '+ Adicionar';
    ab.onclick = async () => {
      if (!ni.value.trim()) return;
      docs.push({ id: 'custom_' + Date.now(), cat: catSel.value, label: ni.value.trim(), prio: prioSel.value, done: false, arquivo: null, validade: '', obs: '' });
      await savePropDocs(meta.id, docs); ni.value = ''; renderPropDocs(main, meta); toast('Documento adicionado');
    };
    addRow.append(ni, catSel, prioSel, ab);
    addSection.appendChild(addRow);
    body.appendChild(addSection);
  }

  window._viewDocData = docs;
  window.viewDocFile = (idx) => {
    const d = window._viewDocData[idx];
    if (!d || !d.arquivo) return;
    const overlay = document.createElement('div'); overlay.className = 'modal-bg';
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    const box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:12px;padding:16px;max-width:90vw;max-height:90vh;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.3)';
    const hdr = document.createElement('div'); hdr.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:16px';
    const title = document.createElement('div'); title.style.cssText = 'font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:300px'; title.textContent = d.arquivo.name;
    const closeBtn = document.createElement('button'); closeBtn.className = 'btn btn-ghost btn-sm'; closeBtn.textContent = '✕ Fechar'; closeBtn.onclick = () => overlay.remove();
    const dlBtn = document.createElement('button'); dlBtn.className = 'btn btn-outline btn-sm'; dlBtn.textContent = '⬇ Baixar';
    dlBtn.onclick = () => { const a = document.createElement('a'); a.href = d.arquivo.data; a.download = d.arquivo.name; a.click(); };
    hdr.append(title, document.createElement('div'));
    hdr.lastChild.style.cssText = 'display:flex;gap:6px;flex-shrink:0';
    hdr.lastChild.append(dlBtn, closeBtn);
    const content = document.createElement('div'); content.style.cssText = 'overflow:auto;flex:1;border-radius:8px;border:1px solid var(--border)';
    if (d.arquivo.data.startsWith('data:application/pdf') || d.arquivo.data.startsWith('data:application/octet') || d.arquivo.name.toLowerCase().endsWith('.pdf')) {
      const frame = document.createElement('iframe'); frame.src = d.arquivo.data; frame.style.cssText = 'width:75vw;height:75vh;border:none;border-radius:7px'; content.appendChild(frame);
    } else {
      const img = document.createElement('img'); img.src = d.arquivo.data; img.style.cssText = 'max-width:75vw;max-height:75vh;display:block;border-radius:7px'; content.appendChild(img);
    }
    box.append(hdr, content); overlay.appendChild(box); document.body.appendChild(overlay);
  };

  redrawDocs();
  main.appendChild(card);

  // Obs jurídicas
  const ficha = await getFicha(meta.id);
  const nc = document.createElement('div'); nc.className = 'card';
  nc.innerHTML = '<div class="card-hdr"><div class="card-title">📝 Obs. Jurídicas / Cartório</div></div><div class="card-body"></div>';
  const nb = nc.querySelector('.card-body');
  const ta = document.createElement('textarea'); ta.className = 'fi'; ta.rows = 4; ta.placeholder = 'Situação no cartório, advogado, inventário, pendências de registro...';
  ta.value = ficha.obs_juridica || '';
  ta.onchange = async () => { ficha.obs_juridica = ta.value; await saveFicha(meta.id, ficha); toast('Salvo'); };
  nb.appendChild(ta);
  main.appendChild(nc);
}

async function renderPipelineGeral(main) {
  main.innerHTML='';
  const ph=document.createElement('div'); ph.className='pg-hdr';
  ph.innerHTML='<div><div class="pg-title">🔄 Pipeline Geral</div><div class="pg-sub">Todos os pagamentos e recebimentos do mês</div></div>';
  ph.appendChild(await mkMN()); main.appendChild(ph);

  const ym=S.month;
  let totalPend=0, totalPago=0, totalRec=0, totalAguard=0;

  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<div class="card-hdr"><div class="card-title">Visão Consolidada</div></div><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Imóvel</th><th>Item</th><th>Tipo</th><th class="num">Valor</th><th>Status</th><th>Comprovante</th></tr></thead><tbody id="pg-tb"></tbody></table></div>';
  main.appendChild(card);

  const tb=card.querySelector('#pg-tb');
  for (const m of PROPS) {
    const pipe=await getPipeline(m.id,ym);

    for (const e of (m.entradas||[])) {
      const ed=pipe.entradas[e.id]||{valor:0,status:'aguardando',comprovante:null};
      if(ed.status==='recebido') totalRec+=Number(ed.valor)||0; else totalAguard+=Number(ed.valor)||0;
      const tr=document.createElement('tr'); tr.className='clickable';
      const sB=ed.status==='recebido'?'<span class="badge b-pago">✓ Recebido</span>':ed.status==='verificado'?'<span class="badge b-aguar">Verificado</span>':'<span class="badge b-pend">Aguardando</span>';
      tr.innerHTML=`<td>${m.icon} ${m.name}</td><td>${e.label}</td><td><span class="badge b-entrada">Entrada</span></td><td class="num tg">${fmt(ed.valor)}</td><td>${sB}</td><td>${ed.comprovante?'<span class="badge b-ok">📎 OK</span>':'<span class="tm">—</span>'}</td>`;
      tr.onclick=()=>navigate(m.id); tb.appendChild(tr);
    }
    for (const c of (m.custos||[]).filter(c=>c.tipo!=='info')) {
      const cd=pipe.custos[c.id]||{valor:0,status:'aberto',comprovante:null};
      if(cd.status==='pago') totalPago+=Number(cd.valor)||0; else totalPend+=Number(cd.valor)||0;
      const tr=document.createElement('tr'); tr.className='clickable';
      const sB=cd.status==='pago'?'<span class="badge b-pago">✓ Pago</span>':cd.status==='boleto_ok'?'<span class="badge b-aguar">Boleto OK</span>':'<span class="badge b-pend">Em aberto</span>';
      tr.innerHTML=`<td>${m.icon} ${m.name}</td><td>${c.label}</td><td><span class="badge b-pend">Saída</span></td><td class="num tr">${fmt(cd.valor)}</td><td>${sB}</td><td>${cd.comprovante?'<span class="badge b-ok">📎 OK</span>':'<span class="tm">—</span>'}</td>`;
      tr.onclick=()=>navigate(m.id); tb.appendChild(tr);
    }
  }

  // Summary kpis
  const kg=document.createElement('div'); kg.className='kpi-grid'; kg.style.marginTop='16px';
  [{label:'Recebido',val:fmt(totalRec),cls:'green'},{label:'A Receber',val:fmt(totalAguard),cls:'yellow'},{label:'Pago',val:fmt(totalPago),cls:'blue'},{label:'A Pagar',val:fmt(totalPend),cls:'red'}]
    .forEach(k=>{const c=document.createElement('div');c.className='kpi '+k.cls;c.innerHTML=`<div class="kpi-lbl">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div>`;kg.appendChild(c);});
  main.appendChild(kg);
}

async function renderAgenda(main) {
  main.innerHTML='';
  const ph=document.createElement('div'); ph.className='pg-hdr';
  ph.innerHTML='<div><div class="pg-title">📅 Agenda de Obrigações</div><div class="pg-sub">Vencimentos e tarefas</div></div>';
  main.appendChild(ph);

  const ym=S.month;
  const items=[];

  for (const m of PROPS) {
    if (!m.baloes) continue;
    for (const b of m.baloes) if (b.mes>=ym && b.mes<=addM(ym,3)) {
      const [y,mo]=b.mes.split('-');
      items.push({date:`${y}-${mo}-10`,title:`Balão — ${m.name}`,sub:fmt(b.valor),urgency:b.mes===ym?'urgent':'warn'});
    }
  }
  items.push({date:'2027-07-01',title:'Quitação — Casa Mirabelle',sub:'Término do parcelamento',urgency:'ok'});
  items.push({date:'2028-12-01',title:'Quitação — Ap Meia Praia',sub:'Último balão',urgency:'ok'});
  for (const m of PROPS.filter(p=>p.situacaoJuridica==='pendente'))
    items.push({date:ym+'-01',title:`Regularizar — ${m.name}`,sub:'Doc. pendente',urgency:'urgent'});

  const saved=await ls.get(SK.agenda)||[];
  const all=[...items,...saved].sort((a,b)=>a.date.localeCompare(b.date));

  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<div class="card-hdr"><div class="card-title">Próximos eventos</div><button class="btn btn-primary btn-sm" id="add-ag">+ Adicionar</button></div><div class="card-body" id="ag-body"></div>';
  const body=card.querySelector('#ag-body');

  for (const item of all) {
    const [y,m,d]=(item.date||ym+'-01').split('-');
    const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid #f8fafc';
    const box=document.createElement('div');

    box.innerHTML=`<div style="font-size:15px;font-weight:800">${d||'--'}</div><div style="font-size:10px;font-weight:700;text-transform:uppercase">${(MONTHS_SH[(+m||1)-1])||'--'}</div>`;
    const info=document.createElement('div'); info.style.flex='1';
    info.innerHTML=`<div style="font-size:13px;font-weight:700">${item.title}</div><div style="font-size:12px;color:var(--text-soft);margin-top:2px">${item.sub||''}</div>`;
    row.append(box,info); body.appendChild(row);
  }
  main.appendChild(card);

  card.querySelector('#add-ag').onclick=async ()=>{
    const modal=document.createElement('div'); modal.className='modal-bg';
    modal.innerHTML=`<div class="modal"><div class="modal-title">+ Nova Obrigação</div>
    <div class="fg"><label class="fl">Título</label><input id="ag-t" class="fi" placeholder="Ex: Renovar contrato"></div>
    <div class="fg"><label class="fl">Data</label><input id="ag-d" class="fi" type="date"></div>
    <div class="fg"><label class="fl">Detalhe</label><input id="ag-s" class="fi" placeholder="Valor, contato..."></div>
    <div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-outline" id="ag-c">Cancelar</button><button class="btn btn-primary" id="ag-sv">Salvar</button></div></div>`;

async function renderDocumentos(main) {

  }

  const kg = document.createElement('div'); kg.className = 'kpi-grid'; kg.style.marginBottom = '20px';
  [
    {label:'Docs Verificados', val:`${tOk}/${td}`, cls:'green', sub:`${pct}% do portfólio OK`},
    {label:'Críticos Pendentes', val:tCrit, cls:tCrit>0?'red':'green', sub:'Precisam atenção urgente'},
    {label:'Arquivos Anexados', val:tArq, cls:'blue', sub:'Documentos digitalizados'},
    {label:'Imóveis Regulares', val:PROPS.filter(p=>p.situacaoJuridica==='ok').length, cls:'purple', sub:`de ${PROPS.length} imóveis`},
  ].forEach(k => { const c = document.createElement('div'); c.className = 'kpi ' + k.cls; c.innerHTML = `<div class="kpi-lbl">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div><div class="kpi-sub">${k.sub}</div>`; kg.appendChild(c); });
  main.appendChild(kg);

  // Alerta de críticos
  const allCrit = [];
  for (const m of PROPS) {
    const d = await getPropDocs(m.id);
    const critPend = d.filter(x => x.prio === 'critico' && !x.done);
    if (critPend.length) allCrit.push({m, docs: critPend});

    const al = document.createElement('div'); al.className = 'alert alert-danger'; al.style.marginBottom = '16px';
    al.innerHTML = `<div class="alert-icon">🚨</div><div><div class="alert-title">${tCrit} documentos críticos pendentes</div><div style="font-size:12px;margin-top:4px">${allCrit.map(x=>`<strong>${x.m.name}</strong>: ${x.docs.map(d=>d.label).join(', ')}`).join(' · ')}</div></div>`;
    main.appendChild(al);
  }

  // Tabela por imóvel
  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<div class="card-hdr"><div class="card-title">Status por Imóvel</div></div><div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>Imóvel</th><th>Cidade/UF</th><th>Progresso</th><th class="num">OK</th><th class="num">Críticos</th><th class="num">Arquivos</th><th>Situação</th><th></th></tr></thead>
    <tbody id="docs-tb"></tbody></table></div>`;
  main.appendChild(card);

  const tb = card.querySelector('#docs-tb');
  for (const m of PROPS) {
    const docs = await getPropDocs(m.id);
    const done = docs.filter(d => d.done).length;
    const crit = docs.filter(d => d.prio === 'critico' && !d.done).length;
    const arqs = docs.filter(d => d.arquivo).length;
    const pct2 = docs.length ? Math.round(done / docs.length * 100) : 100;
    const pc = pct2 === 100 ? 'green' : pct2 > 50 ? 'yellow' : 'red';
    const tr = document.createElement('tr'); tr.className = 'clickable';
    tr.innerHTML = `
      <td><span style="margin-right:6px">${m.icon}</span><strong>${m.name}</strong></td>
      <td class="tm">${m.city}, ${m.state}</td>
      <td style="min-width:100px">

        <div class="prog-bg" style="height:6px"><div class="prog-fill ${pc}" style="width:${pct2}%"></div></div>
      </td>
      <td class="num"><span class="badge ${done===docs.length?'b-ok':'b-parcial'}">${done}/${docs.length}</span></td>
      <td class="num">${crit > 0 ? `<span class="prio-critico">${crit}</span>` : '<span class="tm">—</span>'}</td>
      <td class="num">${arqs > 0 ? `<span class="badge b-entrada">📎 ${arqs}</span>` : '<span class="tm">—</span>'}</td>
      <td><span class="badge ${m.situacaoJuridica==='ok'?'b-ok':m.situacaoJuridica==='parcial'?'b-parcial':'b-pend'}">${m.situacaoJuridica==='ok'?'✓ OK':m.situacaoJuridica==='parcial'?'⚠ Parcial':'✕ Pendente'}</span></td>
      <td><button class="btn btn-outline btn-sm" style="white-space:nowrap">Ver docs ›</button></td>`;
    tr.querySelector('button').onclick = async () => { navigate(m.id); setTimeout(async () => { S.tab = 'documentos'; await renderMain(); }, 50); };
    tr.onclick = e => { if (e.target.tagName === 'BUTTON') return; navigate(m.id); setTimeout(async () => { S.tab = 'documentos'; await renderMain(); }, 50); };
    tb.appendChild(tr);
  }
}

function parseOFX(t){const txs=[];const bl=t.split('<STMTTRN>').slice(1);for(const b of bl){const g=x=>{const m=b.match(new RegExp('<'+x+'>([^<\\n\\r]+)','i'));return m?m[1].trim():'';};const dr=g('DTPOSTED'),date=dr.length>=8?dr.slice(6,8)+'/'+dr.slice(4,6)+'/'+dr.slice(0,4):dr,ar=g('TRNAMT'),amount=Math.abs(parseFloat(ar)||0),type=(g('TRNTYPE').toLowerCase()==='credit'||parseFloat(ar)>0)?'credit':'debit',memo=g('MEMO')||g('NAME')||'';if(amount>0)txs.push({id:Date.now()+Math.random(),date,desc:memo,amount,type,propId:null,conciliado:false});}return txs;}
function parseCSV(t){const lines=t.trim().split('\n').map(l=>l.trim()).filter(Boolean);if(!lines.length)return{bank:'?',txs:[]};const h=lines[0].toLowerCase();let bank='Genérico',sep=',',di=0,dsc=1,ai=2;if(h.includes('data lan')||h.includes('data lan')){bank='Inter';sep=';';const c=lines[0].split(sep).map(x=>x.toLowerCase().trim());di=c.findIndex(x=>x.includes('data'));dsc=c.findIndex(x=>x.includes('hist')||x.includes('desc'));ai=c.findIndex(x=>x.includes('valor'));}else if(h.includes('date')&&h.includes('title')){bank='Nubank';sep=',';const c=lines[0].split(sep).map(x=>x.toLowerCase().trim());di=c.findIndex(x=>x.includes('date'));dsc=c.findIndex(x=>x.includes('title'));ai=c.findIndex(x=>x.includes('amount'));}else{sep=h.includes(';')?';':',';}const txs=[];for(let i=1;i<lines.length;i++){const c=lines[i].split(sep);if(c.length<=Math.max(di,dsc,ai))continue;const date=(c[di]||'').replace(/"/g,'').trim(),desc=(c[dsc]||'').replace(/"/g,'').trim(),as=(c[ai]||'').replace(/"/g,'').replace('.','').replace(',','.').trim(),av=parseFloat(as)||0,amount=Math.abs(av);if(!amount)continue;txs.push({id:Date.now()+Math.random(),date,desc,amount,type:av>=0?'credit':'debit',propId:null,conciliado:false});}return{bank,txs};}
function processExt(file,ym,cb){const r=new FileReader();r.onload=async e=>{const txt=e.target.result;let txs=[],bank='';if(file.name.endsWith('.ofx')){txs=parseOFX(txt);bank='OFX';}else{const res=parseCSV(txt);txs=res.txs;bank=res.bank;}if(!txs.length){toast('Nenhuma transação','error');return;}const ed=await ls.get(SK.extrato)||{};ed[ym]=txs;await ls.set(SK.extrato,ed);toast(txs.length+' transações ('+bank+')');cb();};r.readAsText(file,'latin1');}

async function renderPropReajuste(main, meta) {
  main.innerHTML = '';
  const reaj = await getReajuste(meta.id);
  const hoje = new Date();
  let proximoReaj = null, diasReaj = null, statusReaj = 'ok';
  if (reaj.data_inicio) {
    const ini = new Date(reaj.data_inicio);
    const mesesContrato = Math.floor((hoje-ini)/(1000*60*60*24*30.4));
    const proximoMes = new Date(ini); proximoMes.setMonth(proximoMes.getMonth()+Math.ceil(mesesContrato/12)*12);
    proximoReaj = proximoMes.toISOString().slice(0,10);
    diasReaj = Math.ceil((proximoMes-hoje)/(86400000));
    statusReaj = diasReaj < 0 ? 'vencido' : diasReaj <= 60 ? 'vencendo' : 'ok';
  }

  const card = document.createElement('div'); card.className = 'card';
  card.innerHTML = `<div class="card-hdr"><div class="card-title">📈 Reajuste de Contrato</div>
    ${proximoReaj?`<span class="reaj-badge ${statusReaj!=='ok'?statusReaj:''}">${statusReaj==='ok'?`Próx: ${proximoReaj}`:statusReaj==='vencendo'?`⚠ ${diasReaj}d p/ reajuste`:'✕ Reajuste em atraso'}</span>`:''}
  </div><div class="card-body"></div>`;
  const body = card.querySelector('.card-body');

  const fields = [
    {key:'inquilino', label:'Inquilino', type:'text'},
    {key:'data_inicio', label:'Início do contrato', type:'date'},
    {key:'duracao_meses', label:'Duração (meses)', type:'number', placeholder:'30'},
    {key:'valor_atual', label:'Aluguel atual (R$)', type:'number'},
    {key:'indice', label:'Índice de reajuste', type:'text', placeholder:'IGPM, IPCA, IPC-A...'},
    {key:'percentual_negociado', label:'% negociado (último reajuste)', type:'number'},
    {key:'data_proximo', label:'Data do próximo reajuste', type:'date'},
    {key:'valor_projetado', label:'Valor projetado reajustado (R$)', type:'number'},
    {key:'obs', label:'Observações', type:'text'},
  ];

  const form = document.createElement('div'); form.className = 'fr';
  for (const f of fields) {
    const fg = document.createElement('div'); fg.className = 'fg';
    fg.innerHTML = `<label class="fl">${f.label}</label>`;
    const inp = document.createElement('input'); inp.type = f.type; inp.className = 'fi';
    inp.value = reaj[f.key]||''; if(f.placeholder) inp.placeholder=f.placeholder;
    inp.onchange = async () => { reaj[f.key]=f.type==='number'?(parseFloat(inp.value)||0):inp.value; await saveReajuste(meta.id,reaj); toast('Salvo'); renderPropReajuste(main,meta); };
    fg.appendChild(inp); form.appendChild(fg);
  }
  body.appendChild(form);

  if (reaj.valor_atual && reaj.valor_projetado) {
    const delta = reaj.valor_projetado - reaj.valor_atual;
    const pct = (delta/reaj.valor_atual*100).toFixed(1);
    const info = document.createElement('div'); info.style.cssText='margin-top:14px;padding:12px 16px;background:#f0fdf4;border-radius:8px';
    info.innerHTML = `<div style="font-size:13px;font-weight:700;color:#065f46">Impacto do reajuste</div>
      <div class="rel-row"><span>Valor atual</span><strong>${fmt(reaj.valor_atual)}</strong></div>
      <div class="rel-row"><span>Valor projetado</span><strong class="tg">${fmt(reaj.valor_projetado)}</strong></div>
      <div class="rel-row"><span>Aumento</span><strong class="tg">+${fmt(delta)} (+${pct}%/mês)</strong></div>
      <div class="rel-row"><span>Anual adicional</span><strong class="tg">+${fmt(delta*12)}/ano</strong></div>`;
    body.appendChild(info);
  }
  main.appendChild(card);
}
