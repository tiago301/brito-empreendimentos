// RELATÓRIO MENSAL
// ═══════════════════════════════════════
async function renderRelatorio(main) {
  main.innerHTML='';
  const ym=S.month;
  const ph=document.createElement('div'); ph.className='pg-hdr';
  ph.innerHTML=`<div><div class="pg-title">📋 Relatório Mensal</div><div class="pg-sub">Prestação de contas — ${fmtM(ym)}</div></div>`;
  const btnPrint=document.createElement('button'); btnPrint.className='btn btn-primary';
  btnPrint.innerHTML='🖨️ Imprimir / PDF';
  btnPrint.onclick=()=>window.print();
  ph.appendChild(btnPrint); main.appendChild(ph);

  const tots = await computeAllTotals(ym);

  // Resumo executivo
  const resCard=document.createElement('div'); resCard.className='card';
  resCard.innerHTML=`<div class="card-hdr"><div class="card-title">📊 Resumo Executivo — ${fmtM(ym)}</div></div><div class="card-body">
    <div class="rel-section">
      <div class="rel-section-title">Resultado Consolidado</div>
      <div class="rel-row"><span>Total de entradas</span><strong class="tg">${fmt(tots.totalEntradas)}</strong></div>
      <div class="rel-row"><span>Total de saídas</span><strong class="tr">${fmt(tots.totalSaidas)}</strong></div>
      <div class="rel-row rel-total"><span>Resultado líquido do mês</span><strong class="${tots.net>=0?'tg':'tr'}">${fmt(tots.net)}</strong></div>
    </div>
  </div>`;
  main.appendChild(resCard);

  // Por imóvel
  for (const m of PROPS) {
    const t=await computeTotals(m.id,ym);
    const pipe=await getPipeline(m.id,ym);
    if (t.entradas===0 && t.saidas===0) continue;
    const propCard=document.createElement('div'); propCard.className='card';
    let html=`<div class="card-hdr"><div class="card-title">${m.icon} ${m.name} <span class="badge b-${m.mode}" style="margin-left:6px">${MODE_LABEL[m.mode]}</span></div></div><div class="card-body"><div class="rel-section">`;

    // Entradas
    if (m.entradas?.length) {
      html+=`<div class="rel-section-title">Entradas</div>`;
      for(const e of m.entradas) {
        const ed=pipe.entradas[e.id]||{valor:0,status:'aguardando'};
        const stIcon=ed.status==='recebido'?'✓':ed.status==='verificado'?'⏳':'❌';
        html+=`<div class="rel-row"><span>${e.label}</span><span class="tg">${fmt(ed.valor)} <small>${stIcon}</small></span></div>`;
      }
    }
    // Saídas
    const saidas=m.custos?.filter(c=>c.tipo!=='info')||[];
    if (saidas.length) {
      html+=`<div class="rel-section-title" style="margin-top:10px">Saídas</div>`;
      for(const c of saidas) {
        const cd=pipe.custos[c.id]||{valor:0,status:'aberto'};
        if(!cd.valor) continue;
        const resp=await getResponsavel(m.id,c.id);
        const stIcon=cd.status==='pago'?'✓':cd.status==='boleto_ok'?'⏳':'❌';
        const respLabel=resp.resp==='assistente'?'👩':resp.resp==='imobiliaria'?'🏢':'🤖';
        html+=`<div class="rel-row"><span>${c.label} ${respLabel}</span><span class="tr">${fmt(cd.valor)} <small>${stIcon}</small></span></div>`;
      }
    }
    html+=`<div class="rel-row rel-total"><span>Resultado ${m.name}</span><strong class="${t.net>=0?'tg':'tr'}">${fmt(t.net)}</strong></div></div></div>`;
    propCard.innerHTML=html;
    main.appendChild(propCard);
  }

  // Itens pendentes
  const pendCard=document.createElement('div'); pendCard.className='card';
  let pendHtml=`<div class="card-hdr"><div class="card-title">⚠️ Pendências do Mês</div></div><div class="card-body">`;
  let hasPend=false;
  for(const m of PROPS){
    const pipe=await getPipeline(m.id,ym);
    const pendSaidas=m.custos?.filter(c=>c.tipo!=='info'&&(pipe.custos[c.id]?.status||'aberto')!=='pago'&&(pipe.custos[c.id]?.valor||0)>0)||[];
    const pendEntradas=m.entradas?.filter(e=>((pipe.entradas[e.id]?.status||'aguardando')!=='recebido')&&(pipe.entradas[e.id]?.valor||0)>0)||[];
    if(pendSaidas.length||pendEntradas.length) {
      hasPend=true;
      pendSaidas.forEach(c=>{ pendHtml+=`<div class="rel-row"><span>💳 ${m.name} — ${c.label}</span><span class="tr">${fmt(pipe.custos[c.id]?.valor||0)} (${pipe.custos[c.id]?.status==='boleto_ok'?'Boleto OK':'Em aberto'})</span></div>`; });
      pendEntradas.forEach(e=>{ pendHtml+=`<div class="rel-row"><span>💰 ${m.name} — ${e.label}</span><span class="tm">Aguardando confirmação</span></div>`; });
    }
  }
  if(!hasPend) pendHtml+=`<div class="alert alert-success"><div class="alert-icon">✅</div><div>Todos os itens do mês foram resolvidos!</div></div>`;
  pendHtml+='</div>';
  pendCard.innerHTML=pendHtml;
  main.appendChild(pendCard);
}

// ═══════════════════════════════════════
// RANKING DE IMÓVEIS
// ═══════════════════════════════════════
async function renderRanking(main) {
  main.innerHTML='';
  const ph=document.createElement('div'); ph.className='pg-hdr';
  ph.innerHTML=`<div><div class="pg-title">🏆 Ranking de Imóveis</div><div class="pg-sub">Comparativo de performance do portfólio</div></div>`;
  ph.appendChild(await mkMN()); main.appendChild(ph);
  const ym=S.month;

  // Calcular métricas por imóvel
  const dados=await Promise.all(PROPS.map(async m=>{
    const t=await computeTotals(m.id,ym);
    const yld=await computeYield(m.id);
    const docs=await getPropDocs(m.id);
    const docPct=docs.length?Math.round(docs.filter(d=>d.done).length/docs.length*100):100;
    const ps=await pipelineStatus(m.id,ym);
    return {m,t,yld,docPct,ps};
  }));

  // Ranking por resultado
  const byResult=[...dados].sort((a,b)=>b.t.net-a.t.net);
  const byYield=[...dados].filter(d=>d.yld).sort((a,b)=>Number(b.yld)-Number(a.yld));
  const byCusto=[...dados].sort((a,b)=>b.t.saidas-a.t.saidas);

  const mkRank=(title,list,keyFn)=>{
    const card=document.createElement('div'); card.className='card';
    card.innerHTML=`<div class="card-hdr"><div class="card-title">${title}</div></div><div class="card-body"></div>`;
    const body=card.querySelector('.card-body');
    list.slice(0,8).forEach((d,i)=>{
      const row=document.createElement('div'); row.className='rank-row';
      const numCls=i===0?'gold':i===1?'silver':i===2?'bronze':'';
      row.innerHTML=`<div class="rank-num ${numCls}">${i+1}</div>
        <div style="font-size:16px;width:24px;text-align:center">${d.m.icon}</div>
        <div style="flex:1"><div style="font-size:13px;font-weight:600">${d.m.name}</div><div style="font-size:11px;color:var(--text-soft)">${d.m.city}, ${d.m.state}</div></div>
        <div style="text-align:right"><strong>${keyFn(d)}</strong></div>`;
      row.onclick=()=>navigate(d.m.id); row.style.cursor='pointer';
      row.onmouseenter=()=>row.style.background='#f8fafc'; row.onmouseleave=()=>row.style.background='';
      body.appendChild(row);
    });
    return card;
  };

  const grid=document.createElement('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:16px';
  grid.appendChild(mkRank('💰 Maior Resultado (mês)',byResult,d=>`<span class="${d.t.net>=0?'tg':'tr'}">${fmt(d.t.net)}</span>`));
  if(byYield.length) grid.appendChild(mkRank('📈 Maior Yield (anual)',byYield,d=>`<span class="tg">${d.yld}% a.a.</span>`));
  grid.appendChild(mkRank('💸 Maior Custo (mês)',byCusto,d=>`<span class="tr">${fmt(d.t.saidas)}</span>`));
  main.appendChild(grid);

  // Tabela completa
  const tc=document.createElement('div'); tc.className='card'; tc.style.marginTop='16px';
  tc.innerHTML=`<div class="card-hdr"><div class="card-title">Comparativo Completo</div></div><div style="overflow-x:auto"><table class="tbl">
    <thead><tr><th>Imóvel</th><th>Tipo</th><th class="num">Entradas</th><th class="num">Saídas</th><th class="num">Resultado</th><th class="num">Yield a.a.</th><th class="num">Docs %</th><th>Pipeline</th></tr></thead>
    <tbody id="rank-tb"></tbody></table></div>`;
  main.appendChild(tc);
  const tb=tc.querySelector('#rank-tb');
  dados.sort((a,b)=>b.t.net-a.t.net).forEach(d=>{
    const tr=document.createElement('tr'); tr.className='clickable';
    tr.innerHTML=`<td>${d.m.icon} ${d.m.name}</td>
      <td><span class="badge b-${d.m.mode}">${MODE_LABEL[d.m.mode]}</span></td>
      <td class="num ${d.t.entradas>0?'tg':'tm'}">${fmt(d.t.entradas)}</td>
      <td class="num ${d.t.saidas>0?'tr':'tm'}">${fmt(d.t.saidas)}</td>
      <td class="num ${d.t.net>=0?'tg':'tr'}">${fmt(d.t.net)}</td>
      <td class="num">${d.yld?`<span class="tg">${d.yld}%</span>`:'<span class="tm">—</span>'}</td>
      <td class="num"><span class="${d.docPct===100?'tg':d.docPct>50?'':'tr'}">${d.docPct}%</span></td>
      <td>${d.ps.pendente===0?'<span class="badge b-ok">✓</span>':`<span class="badge b-pend">${d.ps.pendente}</span>`}</td>`;
    tr.onclick=()=>navigate(d.m.id); tb.appendChild(tr);
  });
}

// ═══════════════════════════════════════
// ALERTAS
// ═══════════════════════════════════════
async function renderAlertas(main) {
  main.innerHTML='';
  const ph=document.createElement('div'); ph.className='pg-hdr';
  ph.innerHTML='<div><div class="pg-title">🔔 Central de Alertas</div><div class="pg-sub">Vencimentos e documentos próximos do prazo</div></div>';
  main.appendChild(ph);

  const venc=await getVencimentos(30);
  const urgentes=venc.filter(v=>v.urgente);
  const avisos=venc.filter(v=>!v.urgente);

  if(!venc.length) {
    const card=document.createElement('div'); card.className='card';
    card.innerHTML='<div class="card-body"><div class="empty"><div class="ei">✅</div><div class="et">Nenhum alerta nos próximos 30 dias</div></div></div>';
    main.appendChild(card); return;
  }

  const kg=document.createElement('div'); kg.className='kpi-grid'; kg.style.marginBottom='16px';
  [{label:'Urgentes',val:urgentes.length,cls:urgentes.length>0?'red':'green',sub:'Vence em ≤7 dias'},{label:'Avisos',val:avisos.length,cls:'yellow',sub:'Vence em ≤30 dias'}]
    .forEach(k=>{const c=document.createElement('div');c.className='kpi '+k.cls;c.innerHTML=`<div class="kpi-lbl">${k.label}</div><div class="kpi-val ${k.cls}">${k.val}</div><div class="kpi-sub">${k.sub}</div>`;kg.appendChild(c);});
  main.appendChild(kg);

  const mkSection=async (title,items)=>{
    if(!items.length) return;
    const card=document.createElement('div'); card.className='card'; card.style.marginBottom='14px';
    card.innerHTML=`<div class="card-hdr"><div class="card-title">${title}</div></div><div class="card-body"></div>`;
    const body=card.querySelector('.card-body');
    for(const v of items) {
      const row=document.createElement('div'); row.style.cssText='display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #f8fafc;cursor:pointer';
      const urgClass=v.urgente?'urgente':'aviso';
      if(v.isDoc) {
        row.innerHTML=`<div class="alert-venc-item ${urgClass}" style="flex:1;margin:0">📄 <strong>${v.prop.name}</strong> — ${v.doc.label} <span style="margin-left:auto">vence em <strong>${v.dias}d</strong></span></div>`;
      } else {
        row.innerHTML=`<div class="alert-venc-item ${urgClass}" style="flex:1;margin:0">💳 <strong>${v.prop.name}</strong> — ${v.custo.label} <span style="margin-left:auto">dia ${v.custo.vencDia} (<strong>${v.dias}d</strong>)</span></div>`;
      }
      row.onclick=async ()=>{navigate(v.prop.id);setTimeout(async ()=>{S.tab=v.isDoc?'documentos':'pipeline';await renderMain();},100);};
      body.appendChild(row);
    }
    main.appendChild(card);
  };

  mkSection('🔴 Urgentes — vence em até 7 dias',urgentes);
  mkSection('🟡 Avisos — vence em 8-30 dias',avisos);
}

// ═══════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════
async function renderConfig(main) {
  main.innerHTML='';
  const ph=document.createElement('div'); ph.className='pg-hdr';
  ph.innerHTML='<div><div class="pg-title">⚙️ Configurações</div></div>';
  main.appendChild(ph);

  const uc=document.createElement('div'); uc.className='card';
  uc.innerHTML='<div class="card-hdr"><div class="card-title">Utilitários</div></div><div class="card-body" style="display:flex;gap:10px;flex-wrap:wrap"></div>';
  const ub=uc.querySelector('.card-body');

  const bExp=document.createElement('button'); bExp.className='btn btn-primary'; bExp.innerHTML='⬇ Exportar backup';
  bExp.onclick=async ()=>{
    const d={
      pipeline:await ls.get(SK.pipeline), docs:await ls.get(SK.docs), agenda:await ls.get(SK.agenda),
      extrato:await ls.get(SK.extrato), ficha:await ls.get(SK.ficha),
      contatos:await ls.get(SK.contatos), reservas:await ls.get(SK.reservas), seguros:await ls.get(SK.seguros),
      reajuste:await ls.get(SK.reajuste), funil:await ls.get(SK.funil), responsavel:await ls.get(SK.responsavel),
      props:await ls.get(SK.props), at:new Date().toISOString()
    };
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));
    a.download='brito-empreendimentos-backup-'+S.month+'.json'; a.click(); toast('Backup completo exportado');
  };

  const bImp=document.createElement('button'); bImp.className='btn btn-outline'; bImp.innerHTML='⬆ Importar backup';
  const iInp=document.createElement('input'); iInp.type='file'; iInp.accept='.json'; iInp.style.display='none';
  iInp.onchange=()=>{const f=iInp.files[0];if(!f)return;const r=new FileReader();r.onload=async e=>{try{
    const d=JSON.parse(e.target.result);
    const keys=['pipeline','docs','agenda','extrato','ficha','contatos','reservas','seguros','reajuste','funil','responsavel','props'];
    const skMap={pipeline:SK.pipeline,docs:SK.docs,agenda:SK.agenda,extrato:SK.extrato,ficha:SK.ficha,contatos:SK.contatos,reservas:SK.reservas,seguros:SK.seguros,reajuste:SK.reajuste,funil:SK.funil,responsavel:SK.responsavel,props:SK.props};
    for(const k of keys){if(d[k]) await ls.set(skMap[k],d[k]);}
    if(d.props) await loadUserProps();
    toast('Backup importado com sucesso'); renderSidebar(); renderMain();
  }catch{toast('Erro ao importar','error');}};r.readAsText(f);};
  bImp.onclick=()=>iInp.click();

  const bReset=document.createElement('button'); bReset.className='btn btn-danger'; bReset.innerHTML='⚠ Resetar';
  bReset.onclick=async ()=>{if(confirm('Apagar TODOS os dados?')){for(const t of Object.values(SK)) await dbSet(t,'main',null);toast('Resetado','info');await renderMain();}};


  const bMigrate=document.createElement('button'); bMigrate.className='btn btn-success'; bMigrate.innerHTML='☁ Migrar localStorage → Supabase';
  bMigrate.onclick=async ()=>{
    if(!confirm('Migrar dados do localStorage para o Supabase? Os dados locais serão copiados para a nuvem.')) return;
    const skMap={pipeline:SK.pipeline,docs:SK.docs,agenda:SK.agenda,extrato:SK.extrato,ficha:SK.ficha,contatos:SK.contatos,reservas:SK.reservas,seguros:SK.seguros,reajuste:SK.reajuste,funil:SK.funil,responsavel:SK.responsavel,props:SK.props};
    const lsKeys={pipeline:'be3_pipe',docs:'be3_docs',agenda:'be3_agenda',extrato:'be3_ext',ficha:'be3_ficha',contatos:'be3_contatos',reservas:'be3_reservas',seguros:'be3_seguros',reajuste:'be3_reajuste',funil:'be3_funil',responsavel:'be3_resp',props:'be3_props'};
    let count=0;
    for(const[name,lsKey]of Object.entries(lsKeys)){
      try{const v=JSON.parse(localStorage.getItem(lsKey));if(v){await dbSet(skMap[name],'main',v);count++;}}catch(e){}
    }
    if(count>0){await loadUserProps();await renderSidebar();await renderMain();}
    toast(count>0?`${count} chaves migradas!`:'Nenhum dado local encontrado','info');
  };
  ub.append(bExp,bImp,iInp,bReset,bMigrate);
  main.appendChild(uc);

  const sc=document.createElement('div'); sc.className='card';
  sc.innerHTML=`<div class="card-hdr"><div class="card-title">Armazenamento</div></div><div class="card-body"><div style="font-size:13px;color:var(--text-soft)">Dados sincronizados no Supabase ☁️</div></div>`;
  main.appendChild(sc);
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
async function init() {
  const main = document.getElementById('main');
  main.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:200px;color:var(--text-muted);font-size:15px;gap:10px"><span style="animation:spin 1s linear infinite;display:inline-block">⏳</span> Carregando dados...</div>';
  S.month = ymNow();
  try {
    await loadUserProps();
    await renderSidebar();
    await renderMain();
  } catch(e) {
    main.innerHTML = '<div style="padding:20px;color:red;font-size:13px;white-space:pre-wrap">Erro ao carregar: ' + e.message + '\n' + (e.stack||'') + '</div>';
    console.error('init error:', e);
  }
}
init();
</script>
